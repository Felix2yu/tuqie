<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b10" />
    <meta name="description" content="把长截图拆分成多张独立照片，支持自动识别分割线和一键存入相册" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Legacy IE and old Edge only ever look for the .ico; give it a slot first so
         the SVG below can win everywhere it is understood. -->
    <link rel="alternate icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <!-- 主屏磁贴。Apple 自己的写法是不带 sizes 的这一个：iOS 按它内置的那组候选尺寸挑，
         声明了 sizes 就有挑不中的余地，所以先给一个不挑的。
         根路径那份还兼着接住 iOS 不读 link、直接探测 /apple-touch-icon.png 的那条路。
         512 留给 iPad 和 Dock，只给 180 的话系统得放大，斜边的台阶会跟着被放大。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/apple-touch-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="图切" />
    <title>图切 · 长截图拆分工具</title>
    <script>
      // data-theme is what every colour on the page hangs off, and the bundle that
      // owns it arrives after the first paint. Setting it here is the difference
      // between a light-theme visitor seeing their own page and seeing a dark one
      // flip to light a moment later.
      (function () {
        var choice = 'auto';
        try {
          choice = localStorage.getItem('tuqie-theme') || 'auto';
        } catch (e) {
          /* no storage: follow the system */
        }
        if (choice !== 'light' && choice !== 'dark') choice = 'auto';
        var isDark = choice === 'dark' || (choice === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
