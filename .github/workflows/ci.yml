name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: .
      # 同一个 job 里前端先构建，web/dist 已经躺在 go:embed 的位置上，
      # 所以连 main 包一起跑，而不只是 ./internal/...
      test-packages: ./...
      # 不加 -race：覆盖率插桩叠上 race 后，1080x21600 那次 Analyze 实测 8.095s，
      # 直接顶爆 detect_test 里 3s 的计时预算（单开 -race 是 0.4s 级、通过）。
      # 走默认的 -covermode=atomic：插桩后整包 4.2s，计时断言有余量。
      web-dir: web
      codecov-disable-search: true

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/tuqie
      binary-name: tuqie
      image-name: ghcr.io/felix2yu/tuqie
      cgo: off
      # CGO_ENABLED=0 不等于静态：gen2brain/avif 默认编进 purego 的 dlopen 路径，
      # 产物仍带 PT_INTERP=/lib64/ld-linux-x86-64.so.2，扔进 alpine（musl）启动即 ENOENT。
      # nodynamic 只留 wazero 那条 WASM 路（alpine 里本来也没有 libavif 可 dlopen）。
      build-tags: nodynamic
      # go:embed 需要 web/dist；reusable 流程构建前端后就位在同一目录
      web-dir: web

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      main-package: ./cmd/tuqie
      binary-name: tuqie
      cgo: off
      web-dir: web
